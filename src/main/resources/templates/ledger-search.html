<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ledger Search</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }

        .card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; text-align: center; }

        h2 { color: #2c3e50; margin-bottom: 20px; }

        /* Input Style */
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }

        /* BUTTON STYLES */
        .btn { background: #2980b9; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #2573a7; }

        .btn-add { background: #27ae60; margin-top: 15px; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-add:hover { background: #219150; }

        /* NEW: Report Button Style */
        .btn-report { background: #e67e22; margin-top: 15px; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; display: block; box-sizing: border-box; text-decoration: none; }
        .btn-report:hover { background: #d35400; }

        .error { color: #e74c3c; margin-bottom: 15px; font-size: 14px; background: #fadbd8; padding: 10px; border-radius: 5px; }
        .home-link { display: block; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-size: 14px; }

        /* MODAL STYLES */
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fefefe; margin: 10% auto; padding: 25px; border: 1px solid #888; width: 350px; border-radius: 8px; position: relative; text-align: left; }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; position: absolute; top: 5px; right: 15px; }
        .close-btn:hover { color: black; }

        .modal h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
        .modal label { display: block; text-align: left; font-weight: bold; font-size: 12px; color: #555; margin-top: 10px; }
    </style>
    <script>
        function openModal() { document.getElementById('addCustomerModal').style.display = 'block'; }
        function closeModal() { document.getElementById('addCustomerModal').style.display = 'none'; }

        window.onclick = function(event) {
            if (event.target == document.getElementById('addCustomerModal')) {
                closeModal();
            }
        }
    </script>
</head>
<body>

<div class="card">
    <h2>📒 Customer Ledger</h2>

    <div th:if="${error}" class="error">
        ⚠️ <span th:text="${error}"></span>
    </div>
    <div th:if="${param.error}" class="error">
        ⚠️ <span th:text="${param.error}"></span>
    </div>

    <form action="/ledger/view" method="get">
        <label style="text-align: left; font-weight: bold; color: #555; display: block; margin-bottom: 5px;">Search Customer</label>

        <input list="customerList" name="phone" placeholder="Start typing Name or Number..." required autofocus autocomplete="off">

        <datalist id="customerList">
            <option th:each="c : ${customers}"
                    th:value="${c.phoneNumber}"
                    th:text="${c.name} + ' (' + ${c.phoneNumber} + ')'">
            </option>
        </datalist>

        <button type="submit" class="btn">🔍 Search Ledger</button>
    </form>

    <button onclick="openModal()" class="btn-add">➕ Add New Customer</button>

    <a href="/customers/report" class="btn-report">📊 View Market Report</a>

    <a href="/" class="home-link">← Back to Dashboard</a>
</div>

<div id="addCustomerModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3>Add New Customer</h3>

        <form action="/customers/add" method="post">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter Name" required>

            <label>Phone Number</label>
            <input type="text" name="phoneNumber" placeholder="Enter 10-digit Phone" required>

            <label>Old Pending Balance (Udhaar)</label>
            <input type="number" step="0.01" name="initialBalance" placeholder="Amount they owe (e.g. 5000)" value="0.0">

            <button type="submit" class="btn-add">Save & View Ledger</button>
        </form>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Product</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 20px; }
        .container { max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; }
        label { font-weight: bold; color: #555; display: block; margin-top: 15px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-save { width: 100%; background: #2980b9; color: white; padding: 12px; border: none; border-radius: 5px; margin-top: 25px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .btn-cancel { display: block; text-align: center; margin-top: 15px; color: #777; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>✏️ Edit Product Details</h2>

    <form action="/products/update" method="post" th:object="${product}">
        <input type="hidden" th:field="*{id}">

        <label>Product Name</label>
        <input type="text" th:field="*{name}" required>

        <label>Category</label>
        <select th:field="*{category}">
            <option value="Fertilizer">Fertilizer</option>
            <option value="Pesticide">Pesticide</option>
            <option value="Seeds">Seeds</option>
            <option value="Equipment">Equipment</option>
        </select>

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Stock Qty</label>
                <input type="number" step="any" th:field="*{totalStock}" required>
            </div>
            <div style="flex: 1;">
                <label>Unit</label>
                <select th:field="*{unitType}">
                    <option value="kg">kg</option>
                    <option value="g">g</option>
                    <option value="L">L</option>
                    <option value="ml">ml</option>
                    <option value="pcs">pcs</option>
                    <option value="pkt">pkt</option>
                    <option value="bag">bag</option>
                </select>
            </div>
        </div>

        <label>Cost Price (Buying)</label>
        <input type="number" step="any" th:field="*{costPricePerUnit}" required>

        <label>Retail Price (Selling)</label>
        <input type="number" step="any" th:field="*{retailPricePerUnit}" required>

        <label>Wholesale Price (Bulk)</label>
        <input type="number" step="any" th:field="*{wholesalePricePerUnit}">

        <hr style="margin-top: 20px; border: 0; border-top: 1px solid #eee;">

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Supplier Name</label>
                <input type="text" th:field="*{supplierName}">
            </div>
            <div style="flex: 1;">
                <label>Supplier Phone</label>
                <input type="text" th:field="*{supplierPhone}">
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Buying Date</label>
                <input type="date" th:field="*{buyingDate}">
            </div>
            <div style="flex: 1;">
                <label>Expiry Date</label>
                <input type="date" th:field="*{expiryDate}">
            </div>
        </div>

        <label>Remarks</label>
        <textarea th:field="*{remarks}" rows="3"></textarea>

        <button type="submit" class="btn-save">💾 Update Product</button>
        <a href="/products" class="btn-cancel">Cancel</a>
    </form>
</div>

</body>
</html>

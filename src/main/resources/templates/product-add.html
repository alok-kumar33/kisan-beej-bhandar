<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Product</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
        label { font-weight: bold; color: #555; display: block; margin-top: 15px; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .btn-save { width: 100%; background: #27ae60; color: white; padding: 12px; border: none; border-radius: 5px; margin-top: 25px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .btn-cancel { display: block; text-align: center; margin-top: 15px; color: #777; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>➕ Add New Product</h2>

    <form action="/products/add" method="post" th:object="${product}">

        <label>Product Name</label>
        <input type="text" th:field="*{name}" required placeholder="e.g. Urea 50kg Bag">

        <label>Category</label>
        <select th:field="*{category}">
            <option value="Fertilizer">Fertilizer</option>
            <option value="Pesticide">Pesticide</option>
            <option value="Seeds">Seeds</option>
            <option value="Equipment">Equipment</option>
        </select>

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Initial Stock Qty</label>
                <input type="number" step="any" th:field="*{totalStock}" required placeholder="0.0">
            </div>
            <div style="flex: 1;">
                <label>Unit Type</label>
                <select th:field="*{unitType}">
                    <option value="kg">kg (Kilogram)</option>
                    <option value="g">g (Gram)</option>
                    <option value="L">L (Liter)</option>
                    <option value="ml">ml (Milliliter)</option>
                    <option value="pcs">pcs (Pieces)</option>
                    <option value="pkt">pkt (Packet)</option>
                    <option value="bag">bag (Bag)</option>
                </select>
            </div>
        </div>

        <label>Cost Price (Buying Rate)</label>
        <input type="number" step="any" th:field="*{costPricePerUnit}" required placeholder="Buying Price">

        <label>Retail Price (Selling Rate)</label>
        <input type="number" step="any" th:field="*{retailPricePerUnit}" required placeholder="Selling Price">

        <label>Wholesale Price (Optional)</label>
        <input type="number" step="any" th:field="*{wholesalePricePerUnit}" placeholder="Bulk Price">

        <hr style="margin-top: 20px; border: 0; border-top: 1px solid #eee;">

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Supplier Name</label>
                <input type="text" th:field="*{supplierName}" placeholder="Supplier Name">
            </div>
            <div style="flex: 1;">
                <label>Supplier Phone</label>
                <input type="text" th:field="*{supplierPhone}" placeholder="Mobile No.">
            </div>
        </div>

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Buying Date</label>
                <input type="date" th:field="*{buyingDate}">
            </div>
            <div style="flex: 1;">
                <label>Expiry Date</label>
                <input type="date" th:field="*{expiryDate}">
            </div>
        </div>

        <label>Remarks (Extra Info)</label>
        <textarea th:field="*{remarks}" rows="3" placeholder="Batch number, instructions..."></textarea>

        <button type="submit" class="btn-save">Save Product</button>
        <a href="/products" class="btn-cancel">Cancel</a>
    </form>
</div>

</body>
</html>

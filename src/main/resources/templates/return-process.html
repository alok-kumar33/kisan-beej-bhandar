<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Process Return</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 20px; max-width: 900px; margin: 0 auto; }
        .header { background: #e74c3c; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        table { width: 100%; background: white; border-collapse: collapse; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #34495e; color: white; }
        .return-form { display: flex; gap: 10px; }
        .return-form input { width: 80px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-return { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<a href="/returns" style="color: #555; text-decoration: none; font-weight: bold;">← Back to Search</a>

<div class="header">
    <h2 style="margin: 0;">Bill #<span th:text="${sale.id}"></span></h2>
    <div style="text-align: right;">
        <div>Customer: <span th:text="${sale.customerName}"></span></div>
        <div>Payment: <span th:text="${sale.paymentMode}"></span></div>
    </div>
</div>

<table>
    <thead>
    <tr>
        <th>Product</th>
        <th>Sold Qty</th>
        <th>Price</th>
        <th>Process Return</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${sale.items}">
        <td style="font-weight: bold;" th:text="${item.product.name}">Product</td>
        <td>
            <span th:text="${item.quantitySold}"></span>
            <span th:text="${item.unitType}"></span>
        </td>
        <td th:text="'₹ ' + ${item.pricePerUnit}">0.00</td>
        <td>
            <form action="/returns/process" method="post" class="return-form" th:if="${item.quantitySold > 0}">
                <input type="hidden" name="saleId" th:value="${sale.id}">
                <input type="hidden" name="itemId" th:value="${item.id}">

                <input type="number" step="0.01" name="returnQty" th:max="${item.quantitySold}" placeholder="Qty" required>
                <input type="text" name="remarks" placeholder="Reason..." style="width: 120px;">

                <button type="submit" class="btn-return" onclick="return confirm('Confirm Return? Stock will increase immediately.')">Return</button>
            </form>

            <span th:if="${item.quantitySold <= 0}" style="color: #e74c3c; font-weight: bold;">Fully Returned</span>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>

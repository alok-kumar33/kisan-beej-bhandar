<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Staff Management</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f4f6f8; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        .btn-del { color: red; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2>👥 Manage Staff & Owners</h2>

    <form action="/users/add" method="post" style="background: #e8f5e9; padding: 15px; border-radius: 5px;">
        <h3>➕ Add New User</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <input type="text" name="fullName" placeholder="Full Name" required>
            <input type="text" name="username" placeholder="User ID / Login ID" required>
            <input type="password" name="password" placeholder="Password" required>
            <select name="role">
                <option value="STAFF">Staff</option>
                <option value="OWNER">Owner</option>
                <option value="ADMIN">Admin</option>
            </select>
            <input type="text" name="phoneNumber" placeholder="Phone">
            <input type="text" name="address" placeholder="Address">
        </div>
        <button type="submit" style="margin-top: 10px; padding: 10px; background: #27ae60; color: white; border: none; cursor: pointer;">Create Account</button>
    </form>

    <h3>Existing Users</h3>
    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>User ID</th>
            <th>Role</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.fullName}">Name</td>
            <td th:text="${u.username}">ID</td>
            <td>
                <span th:if="${u.role == 'ADMIN'}" style="background: #000; color: #fff; padding: 3px 6px; border-radius: 4px;">ADMIN</span>
                <span th:if="${u.role == 'OWNER'}" style="background: blue; color: #fff; padding: 3px 6px; border-radius: 4px;">OWNER</span>
                <span th:if="${u.role == 'STAFF'}" style="background: green; color: #fff; padding: 3px 6px; border-radius: 4px;">STAFF</span>
            </td>
            <td>
                <a th:if="${u.role != 'ADMIN'}"
                   th:href="@{/users/delete/{id}(id=${u.id})}"
                   class="btn-del"
                   onclick="return confirm('⚠️ Are you sure you want to delete this staff account?');">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <br>
    <a href="/">← Back to Dashboard</a>
</div>
</body>
</html>

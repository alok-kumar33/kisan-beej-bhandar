<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Ledger</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }

        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; color: #2c3e50; }

        /* BALANCE BADGE */
        .balance-box { text-align: center; padding: 20px; background: #fff3cd; border-radius: 8px; border: 1px solid #ffeeba; margin-bottom: 20px; }
        .balance-amount { font-size: 32px; font-weight: bold; color: #856404; display: block; }

        /* FORMS */
        label { font-weight: bold; display: block; margin-top: 10px; font-size: 13px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-pay { background: #27ae60; color: white; width: 100%; padding: 12px; border: none; border-radius: 5px; margin-top: 15px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-update { background: #2980b9; color: white; width: 100%; padding: 10px; border: none; border-radius: 5px; margin-top: 15px; cursor: pointer; }

        /* TABLE */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #34495e; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }

        .details-form { display: none; margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 15px; }
    </style>
    <script>
        function toggleDetails() {
            var x = document.getElementById("editProfile");
            if (x.style.display === "none") { x.style.display = "block"; }
            else { x.style.display = "none"; }
        }
    </script>
</head>
<body>

<a href="/ledger" style="text-decoration: none; color: #555; font-weight: bold;">← Back to Search</a>
<br><br>

<div class="container">

    <div>
        <div class="card balance-box">
            <span>Current Due Balance</span>
            <span class="balance-amount">₹ <span th:text="${customer.currentBalance}">0.00</span></span>
        </div>

        <div class="card">
            <h3>💰 Collect Payment</h3>
            <form action="/ledger/pay" method="post">
                <input type="hidden" name="customerId" th:value="${customer.id}">
                <input type="hidden" name="phoneRedirect" th:value="${customer.phoneNumber}">

                <label>Amount Received</label>
                <input type="number" step="0.01" name="amount" placeholder="e.g. 5000" required>

                <label>Mode</label>
                <select name="mode">
                    <option value="Cash">Cash</option>
                    <option value="UPI">UPI / Online</option>
                    <option value="Cheque">Cheque</option>
                </select>

                <label>Remarks</label>
                <input type="text" name="remarks" placeholder="Optional note">

                <button type="submit" class="btn-pay">Receive Payment</button>
            </form>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3>👤 Profile
                <button onclick="toggleDetails()" style="float: right; font-size: 12px; cursor: pointer;">Edit</button>
            </h3>

            <p><strong>Name:</strong> <span th:text="${customer.name}">-</span></p>
            <p><strong>Phone:</strong> <span th:text="${customer.phoneNumber}">-</span></p>
            <p><strong>Type:</strong> <span th:text="${customer.customerType}">RETAIL</span></p>
            <p th:if="${customer.shopName}"><strong>Shop:</strong> <span th:text="${customer.shopName}">-</span></p>

            <div id="editProfile" class="details-form">
                <form action="/ledger/update-profile" method="post">
                    <input type="hidden" name="id" th:value="${customer.id}">
                    <input type="hidden" name="phoneNumber" th:value="${customer.phoneNumber}">
                    <input type="hidden" name="currentBalance" th:value="${customer.currentBalance}">

                    <label>Full Name</label>
                    <input type="text" name="name" th:value="${customer.name}" required>

                    <label>Customer Type</label>
                    <select name="customerType">
                        <option value="RETAIL" th:selected="${customer.customerType == 'RETAIL'}">Regular Customer</option>
                        <option value="WHOLESALE" th:selected="${customer.customerType == 'WHOLESALE'}">Wholesale Retailer</option>
                    </select>

                    <label>Shop Name</label>
                    <input type="text" name="shopName" th:value="${customer.shopName}" placeholder="For Retailers">

                    <label>Address</label>
                    <input type="text" name="address" th:value="${customer.address}">

                    <label>PAN Number</label>
                    <input type="text" name="panNumber" th:value="${customer.panNumber}">

                    <button type="submit" class="btn-update">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>📜 Unified Account Statement</h3>
        <table>
            <thead>
            <tr>
                <th>Date</th>
                <th>Particulars</th>
                <th style="color: #c0392b;">Debit (Taken)</th>
                <th style="color: #27ae60;">Credit (Paid)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${ledgerEntries}">
                <td th:text="${#temporals.format(entry.date, 'dd-MMM-yy HH:mm')}">Date</td>
                <td th:text="${entry.description}">Desc</td>

                <td>
                        <span th:if="${entry.type == 'DEBIT'}" style="color: #c0392b; font-weight: bold;"
                              th:text="'₹ ' + ${entry.amount}"></span>
                </td>

                <td>
                        <span th:if="${entry.type == 'CREDIT'}" style="color: #27ae60; font-weight: bold;"
                              th:text="'₹ ' + ${entry.amount}"></span>
                </td>
            </tr>
            </tbody>
        </table>

        <p th:if="${ledgerEntries.empty}" style="text-align: center; color: #777; margin-top: 20px;">
            No transaction history available.
        </p>
    </div>

</div>

</body>
</html>

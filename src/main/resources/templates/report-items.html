<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Item Performance</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }

        .header-box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center;}

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #34495e; color: white; }

        .bar-container { background: #eee; width: 100%; height: 8px; border-radius: 4px; margin-top: 5px; }
        .bar-fill { height: 100%; background: #3498db; border-radius: 4px; }

        /* Nav Tabs */
        .nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { background: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; color: #2c3e50; font-weight: bold; border: 1px solid #ddd; }
        .tab:hover { background: #eee; }
        .active-tab { background: #2c3e50; color: white; border-color: #2c3e50; }
    </style>
</head>
<body>

<div class="container">
    <div style="background: #2c3e50; padding: 10px 20px; margin-bottom: 20px; border-radius: 5px;">
        <a href="/" style="color: white; text-decoration: none; font-weight: bold;">🏠 Home</a>
    </div>

    <div class="nav">
        <a href="/reports" class="tab">📊 Dashboard</a>
        <a href="/reports/daybook" class="tab">📅 Day Book</a>
        <a href="/reports/items" class="tab active-tab">📦 Item Sales</a>
        <a href="/reports/stock" class="tab">🏭 Stock Value</a>
    </div>

    <div class="header-box">
        <h2 style="margin:0;">📦 Product Performance</h2>
        <form action="/reports/items" method="get" style="display:flex; gap:10px; align-items:center;">
            <span style="font-size:12px;">From:</span>
            <input type="date" name="start" th:value="${start}" required style="padding: 5px;" />
            <span style="font-size:12px;">To:</span>
            <input type="date" name="end" th:value="${end}" required style="padding: 5px;" />
            <button type="submit" style="padding: 5px 10px; background: #2c3e50; color: white; border:none; border-radius:4px; cursor:pointer;">Filter</button>
        </form>
    </div>

    <table>
        <thead>
        <tr>
            <th>Product Name</th>
            <th>Quantity Sold</th>
            <th>Revenue Generated</th>
            <th>Performance</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td style="font-weight: bold;" th:text="${item.productName}">Urea</td>
            <td>
                <span th:text="${item.quantitySold}">100</span> units
            </td>
            <td style="color: #27ae60; font-weight: bold;">
                ₹ <span th:text="${item.totalRevenue}">5000</span>
            </td>
            <td style="width: 30%;">
                <div class="bar-container">
                    <div class="bar-fill" style="width: 50%;"></div>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${items.empty}" style="text-align: center; padding: 40px; color: #777;">
        No sales data found for this period.
    </div>

</div>
</body>
</html>

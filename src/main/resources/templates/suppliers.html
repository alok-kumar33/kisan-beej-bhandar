<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Suppliers</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add { background: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* TABLE */
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #34495e; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }

        .balance-red { color: #c0392b; font-weight: bold; }
        .balance-green { color: #27ae60; font-weight: bold; }

        /* MODAL (Hidden by default) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; width: 400px; margin: 100px auto; padding: 20px; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    </style>
    <script>
        function openModal() { document.getElementById('addModal').style.display = 'block'; }
        function closeModal() { document.getElementById('addModal').style.display = 'none'; }
    </script>
</head>
<body>

<div style="background: #2c3e50; padding: 10px 20px; margin-bottom: 20px;">
    <a href="/" style="color: white; text-decoration: none; font-weight: bold;">🏠 Home Dashboard</a>
</div>

<div class="container">
    <div class="header">
        <h2>🚚 Distributors & Suppliers</h2>
        <button class="btn-add" onclick="openModal()">+ Add New Supplier</button>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Agency / Shop Name</th>
                <th>Contact Person</th>
                <th>Phone</th>
                <th>Our Debt (Payable)</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${suppliers}">
                <td th:text="${s.agencyName}">Agency</td>
                <td th:text="${s.name}">Name</td>
                <td th:text="${s.phoneNumber}">Phone</td>
                <td>
                        <span th:class="${s.currentBalance > 0 ? 'balance-red' : 'balance-green'}"
                              th:text="'₹ ' + ${s.currentBalance}">0.00</span>
                </td>
                <td>
                    <a th:href="@{/suppliers/{id}(id=${s.id})}" style="color: blue; font-weight: bold;">View Ledger</a>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${suppliers.empty}" style="text-align: center; color: #777; margin-top: 20px;">
            No suppliers added yet. Click "Add New Supplier" to start.
        </p>
    </div>
</div>

<div id="addModal" class="modal">
    <div class="modal-content">
        <h3>New Supplier</h3>
        <form action="/suppliers/add" method="post">
            <label>Agency Name</label>
            <input type="text" name="agencyName" placeholder="e.g. Sharma Agencies" required>

            <label>Contact Person</label>
            <input type="text" name="name" placeholder="e.g. Mr. Sharma">

            <label>Phone Number</label>
            <input type="text" name="phoneNumber" placeholder="10-digit Mobile" required>

            <label>GST Number</label>
            <input type="text" name="gstNumber" placeholder="Optional">

            <label>Address</label>
            <input type="text" name="address" placeholder="City/Locality">

            <button type="submit" class="btn-add" style="width: 100%; margin-top: 15px;">Save Supplier</button>
            <button type="button" onclick="closeModal()" style="width: 100%; margin-top: 10px; background: #ccc; border:none; padding:10px; border-radius:5px; cursor:pointer;">Cancel</button>
        </form>
    </div>
</div>

</body>
</html>

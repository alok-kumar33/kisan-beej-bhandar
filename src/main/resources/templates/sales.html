<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Sale - AgriShop</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f8; padding: 20px; display: flex; gap: 20px; }
        .selection-panel { flex: 1; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: fit-content; }
        .cart-panel { flex: 1; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); min-height: 500px; display: flex; flex-direction: column; }
        h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #555; }
        select, input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }

        .add-btn { background-color: #2980b9; color: white; width: 100%; padding: 12px; border: none; border-radius: 5px; margin-top: 20px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .checkout-btn { background-color: #27ae60; color: white; width: 100%; padding: 15px; border: none; border-radius: 5px; margin-top: 20px; cursor: pointer; font-size: 18px; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; border-bottom: 2px solid #ddd; padding: 10px; color: #7f8c8d; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .total-section { margin-top: auto; border-top: 2px solid #eee; padding-top: 20px; text-align: right; font-size: 1.5em; font-weight: bold; color: #2c3e50; }
        .remove-btn { color: red; cursor: pointer; font-weight: bold; }

        .price-toggle { background: #eee; padding: 10px; border-radius: 5px; display: flex; gap: 15px; align-items: center; margin-bottom: 15px; border: 1px solid #ddd; }
        .badge-ws { background: #e67e22; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; display: none;}

        .balance-alert { font-size: 12px; font-weight: bold; margin-top: 5px; display: none; }
        .balance-red { color: #c0392b; }
        .balance-green { color: #27ae60; }

        /* --- NEW: QR MODAL STYLES --- */
        .qr-modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .qr-content { background-color: white; margin: 5% auto; padding: 30px; width: 350px; border-radius: 10px; text-align: center; position: relative; }
        .qr-image { width: 250px; height: 250px; object-fit: contain; border: 2px solid #eee; margin: 15px 0; }
        .amount-display { font-size: 24px; color: #27ae60; font-weight: bold; margin: 10px 0; }
        .close-qr { position: absolute; top: 10px; right: 20px; font-size: 30px; cursor: pointer; color: #aaa; }
    </style>
</head>
<body>
<div style="background: #2c3e50; padding: 10px 20px; margin-bottom: 20px;">
    <a href="/" style="color: white; text-decoration: none; font-weight: bold;">🏠 Home Dashboard</a>
</div>
<div class="selection-panel">
    <h2>🛍️ Select Items</h2>

    <div class="price-toggle">
        <span>Billing Mode:</span>
        <div class="radio-group">
            <input type="radio" name="priceMode" value="retail" checked onchange="updatePriceMode()"> Retail
        </div>
        <div class="radio-group">
            <input type="radio" name="priceMode" value="wholesale" onchange="updatePriceMode()"> Wholesale
        </div>
    </div>

    <label>Search Product (Type Name)</label>
    <input list="productsList" id="productInput" placeholder="Type 'C' for Crystal..." onchange="handleProductSelect(this)">

    <datalist id="productsList">
        <option th:each="p : ${products}"
                th:value="${p.name}"
                th:data-id="${p.id}"
                th:data-unit="${p.unitType}"
                th:data-retail="${p.retailPricePerUnit}"
                th:data-wholesale="${p.wholesalePricePerUnit != null ? p.wholesalePricePerUnit : p.retailPricePerUnit}"
                th:text="'Stock: ' + ${p.totalStock} + ' ' + ${p.unitType}">
        </option>
    </datalist>

    <label>Quantity <span id="unitLabel" style="font-weight: normal; color: #7f8c8d;"></span></label>
    <input type="number" id="qtyInput" placeholder="0.0" step="0.1">

    <button class="add-btn" onclick="addToCart()">Add to Bill ⬇</button>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

    <h3>👤 Customer Details</h3>

    <label>Phone Number <span style="color:red; font-size:12px;">(Type to Auto-Find)</span></label>
    <input type="text" id="custPhone" placeholder="Enter 10 digit Mobile No.">

    <div id="balanceMsg" class="balance-alert">
        Old Balance: ₹ <span id="oldBal">0.00</span>
    </div>

    <label>Customer Name</label>
    <input type="text" id="custName" placeholder="Name will pop up...">

    <label>Payment Mode</label>
    <select id="payMode">
        <option value="Cash">Cash</option>
        <option value="UPI">UPI / Online</option>
        <option value="Credit">Udhaar (Credit)</option>
    </select>
</div>

<div class="cart-panel">
    <h2>🧾 Current Bill <span id="modeBadge" class="badge-ws">WHOLESALE</span></h2>

    <table>
        <thead>
        <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="cartTableBody"></tbody>
    </table>

    <div class="total-section">
        Total: ₹ <span id="grandTotal">0.00</span>
    </div>

    <button class="checkout-btn" onclick="initiateCheckout()">✅ Complete Sale</button>
</div>

<div id="qrModal" class="qr-modal">
    <div class="qr-content">
        <span class="close-qr" onclick="closeQR()">&times;</span>
        <h2 style="color:#333;">Scan to Pay</h2>

        <img src="/qr.jpeg" class="qr-image" alt="Shop QR Code">

        <div class="amount-display" id="displayAmount">Rs. 0.00</div>

        <p style="color:#777;">Please verify SMS on your phone.</p>

        <button onclick="submitSale()" class="add-btn" style="background:#27ae60;">SMS Verified! Save Bill</button>
    </div>
</div>

<script>
    let cart = [];
    let isWholesale = false;
    let currentSelectedProduct = null;
    let currentTotal = 0.0; // Added variable to track total for QR

    // --- AUTO CUSTOMER FETCH ---
    document.getElementById('custPhone').addEventListener('input', function() {
        const phone = this.value;
        if (phone.length >= 10) {
            fetch('/customers/search?phone=' + phone)
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('Not Found');
                })
                .then(data => {
                    document.getElementById('custName').value = data.name;
                    const balElem = document.getElementById('balanceMsg');
                    const balSpan = document.getElementById('oldBal');
                    balElem.style.display = 'block';
                    balSpan.innerText = data.currentBalance.toFixed(2);
                    if(data.currentBalance > 0) {
                        balElem.className = 'balance-alert balance-red';
                        balElem.innerHTML = '⚠️ Pending Udhaar: ₹ ' + data.currentBalance.toFixed(2);
                    } else {
                        balElem.className = 'balance-alert balance-green';
                        balElem.innerHTML = '✅ No Dues (Balance: ₹ ' + data.currentBalance.toFixed(2) + ')';
                    }
                })
                .catch(err => {
                    document.getElementById('balanceMsg').style.display = 'none';
                });
        }
    });

    // --- PRODUCT SEARCH LOGIC ---
    function handleProductSelect(inputElement) {
        const val = inputElement.value;
        const list = document.getElementById('productsList');
        const options = list.options;

        currentSelectedProduct = null;
        document.getElementById('unitLabel').innerText = "";

        for (let i = 0; i < options.length; i++) {
            if (options[i].value === val) {
                currentSelectedProduct = {
                    id: options[i].getAttribute('data-id'),
                    name: val,
                    unit: options[i].getAttribute('data-unit'),
                    retail: parseFloat(options[i].getAttribute('data-retail')),
                    wholesale: parseFloat(options[i].getAttribute('data-wholesale'))
                };
                document.getElementById('unitLabel').innerText = "(" + currentSelectedProduct.unit + ")";
                break;
            }
        }
    }

    function updatePriceMode() {
        const radios = document.getElementsByName('priceMode');
        for (let r of radios) {
            if (r.checked && r.value === 'wholesale') {
                isWholesale = true;
                document.getElementById('modeBadge').style.display = 'inline-block';
            } else if (r.checked) {
                isWholesale = false;
                document.getElementById('modeBadge').style.display = 'none';
            }
        }
    }

    function addToCart() {
        const qty = parseFloat(document.getElementById('qtyInput').value);

        if (!currentSelectedProduct) {
            alert("Please select a valid product from the list!");
            return;
        }
        if (!qty || qty <= 0) {
            alert("Please enter a valid quantity!");
            return;
        }

        const finalPrice = isWholesale ? currentSelectedProduct.wholesale : currentSelectedProduct.retail;
        const lineTotal = finalPrice * qty;

        cart.push({
            productId: currentSelectedProduct.id,
            name: currentSelectedProduct.name,
            qty: qty,
            price: finalPrice,
            unit: currentSelectedProduct.unit,
            lineTotal: lineTotal
        });

        document.getElementById('qtyInput').value = '';
        document.getElementById('productInput').value = '';
        currentSelectedProduct = null;
        document.getElementById('unitLabel').innerText = '';

        renderCart();
    }

    function renderCart() {
        const tbody = document.getElementById('cartTableBody');
        tbody.innerHTML = '';
        let total = 0;
        cart.forEach((item, index) => {
            total += item.lineTotal;
            const row = `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.qty} ${item.unit}</td>
                    <td>${item.price.toFixed(2)}</td>
                    <td>${item.lineTotal.toFixed(2)}</td>
                    <td><span class="remove-btn" onclick="removeItem(${index})">X</span></td>
                </tr>`;
            tbody.innerHTML += row;
        });
        currentTotal = total; // Update global total variable for QR display
        document.getElementById('grandTotal').innerText = total.toFixed(2);
    }

    function removeItem(index) {
        cart.splice(index, 1);
        renderCart();
    }

    // --- NEW: INTERCEPT CHECKOUT ---
    function initiateCheckout() {
        if (cart.length === 0) { alert("Cart is empty!"); return; }

        const mode = document.getElementById('payMode').value;

        // If mode is UPI (Online), show Modal First
        if (mode === 'UPI') {
            document.getElementById('displayAmount').innerText = "Rs. " + currentTotal.toFixed(2);
            document.getElementById('qrModal').style.display = 'block';
        } else {
            // Otherwise submit immediately
            submitSale();
        }
    }

    function closeQR() {
        document.getElementById('qrModal').style.display = 'none';
    }

    // --- YOUR ORIGINAL SUBMIT FUNCTION (UNCHANGED) ---
    function submitSale() {
        if (cart.length === 0) { alert("Cart is empty!"); return; }

        const phone = document.getElementById('custPhone').value;
        const mode = document.getElementById('payMode').value;

        if (mode === 'Credit' && !phone) {
            alert("❌ For Credit (Udhaar) sales, Phone Number is REQUIRED!");
            return;
        }

        const saleData = {
            customerName: document.getElementById('custName').value || "Walk-in",
            customerPhone: phone,
            paymentMode: mode,
            cartItems: cart.map(item => ({
                productId: parseInt(item.productId), // Added parseInt for safety
                quantity: parseFloat(item.qty),      // Added parseFloat for safety
                price: parseFloat(item.price)        // Added parseFloat for safety
            }))
        };

        fetch('/sales/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(saleData)
        })
        .then(response => {
            if(!response.ok) throw new Error("Server Error");
            return response.json();
        })
        .then(saleId => {
            if(saleId) {
                window.location.href = '/sale/invoice/' + saleId;
            }
            else { alert("Error processing sale"); }
        })
        .catch(err => alert("Error: " + err));
    }
</script>

</body>
</html>

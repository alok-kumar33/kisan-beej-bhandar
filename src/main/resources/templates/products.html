<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Inventory</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 20px; }
        .container { max-width: 98%; margin: 0 auto; } /* Use full screen width */

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .search-box { padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-add { background: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; }

        /* SCROLLABLE TABLE CONTAINER */
        .table-wrapper {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow-x: auto; /* Enables Horizontal Scroll */
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }

        /* Sticky Header */
        thead tr { background: #34495e; color: white; }
        th { padding: 12px 15px; text-align: left; white-space: nowrap; font-size: 14px; }

        /* Table Cells */
        td { padding: 10px 15px; border-bottom: 1px solid #eee; white-space: nowrap; font-size: 14px; color: #333; }

        /* Zebra Striping */
        tbody tr:nth-child(even) { background-color: #f9f9f9; }
        tbody tr:hover { background-color: #f1f1f1; }

        /* Specific Column Colors */
        .col-stock { font-weight: bold; color: #2c3e50; }
        .col-cost { color: #7f8c8d; }
        .col-retail { color: #27ae60; font-weight: bold; }
        .col-wholesale { color: #2980b9; font-weight: bold; }
        .col-expired { color: white; background-color: #e74c3c; padding: 4px 8px; border-radius: 4px; }
        .col-action { text-align: center; }

    </style>
    <script>
        function filterTable() {
            var input, filter, table, tr, td, i, txtValue;
            input = document.getElementById("searchInput");
            filter = input.value.toUpperCase();
            table = document.getElementById("productTable");
            tr = table.getElementsByTagName("tr");
            for (i = 1; i < tr.length; i++) {
                td = tr[i].getElementsByTagName("td")[0];
                if (td) {
                    txtValue = td.textContent || td.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) { tr[i].style.display = ""; }
                    else { tr[i].style.display = "none"; }
                }
            }
        }
    </script>
</head>
<body>

<div style="background: #2c3e50; padding: 10px 20px; margin-bottom: 20px;">
    <a href="/" style="color: white; text-decoration: none; font-weight: bold;">🏠 Home</a>
</div>

<div class="container">
    <div class="header">
        <h2>📦 Product Inventory Master List</h2>
        <input type="text" id="searchInput" onkeyup="filterTable()" class="search-box" placeholder="🔍 Search Product Name...">
        <a href="/products/new" class="btn-add">+ Add Product</a>
    </div>

    <div class="table-wrapper">
        <table id="productTable">
            <thead>
            <tr>
                <th>Product Name</th>
                <th>Category</th>
                <th>Current Stock</th>
                <th>Unit</th>
                <th>Cost Price (Buy)</th>
                <th>Retail Price (Sell)</th>
                <th>Wholesale Price</th>
                <th>Supplier Name</th>
                <th>Supplier Phone</th>
                <th>Buying Date</th>
                <th>Expiry Date</th>
                <th>Remarks</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products}">
                <td style="font-weight: bold;" th:text="${p.name}">Urea</td>
                <td th:text="${p.category}">Fertilizer</td>

                <td class="col-stock" th:text="${p.totalStock}">50</td>
                <td th:text="${p.unitType}">kg</td>

                <td class="col-cost">₹ <span th:text="${p.costPricePerUnit}">400</span></td>
                <td class="col-retail">₹ <span th:text="${p.retailPricePerUnit}">500</span></td>
                <td class="col-wholesale">
                    <span th:if="${p.wholesalePricePerUnit != null}">₹ <span th:text="${p.wholesalePricePerUnit}">450</span></span>
                    <span th:if="${p.wholesalePricePerUnit == null}">-</span>
                </td>

                <td th:text="${p.supplierName != null ? p.supplierName : '-'}">-</td>
                <td th:text="${p.supplierPhone != null ? p.supplierPhone : '-'}">-</td>

                <td th:text="${p.buyingDate != null ? #temporals.format(p.buyingDate, 'dd-MM-yyyy') : '-'}">-</td>

                <td>
                        <span th:if="${p.expiryDate != null}"
                              th:text="${#temporals.format(p.expiryDate, 'dd-MM-yyyy')}"
                              th:class="${p.expiryDate.isBefore(T(java.time.LocalDate).now()) ? 'col-expired' : ''}">
                        </span>
                    <span th:if="${p.expiryDate == null}">-</span>
                </td>

                <td th:text="${p.remarks}"></td>

                <td class="col-action">
                    <a th:href="@{/products/edit/{id}(id=${p.id})}" style="text-decoration: none; font-size: 18px;" title="Edit Product">✏️</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>

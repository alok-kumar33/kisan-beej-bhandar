<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inventory Manager</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #1a1a1a; border-left: 5px solid #27ae60; padding-left: 15px; margin-bottom: 25px; }

        /* BOXES */
        .calc-box { background-color: #e8f5e9; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #c8e6c9; }
        .price-box { background-color: #fff3e0; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ffe0b2; }
        .wholesale-box { background-color: #e3f2fd; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #bbdefb; }

        .section-title { font-weight: bold; display: block; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.9em; }
        .green-text { color: #2e7d32; }
        .orange-text { color: #e65100; }
        .blue-text { color: #1565c0; }

        /* FORM LAYOUT */
        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .form-row-2 { grid-template-columns: 1fr 1fr; }

        label { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 8px; display: block; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }

        .btn { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .btn:hover { background: #219150; }

        /* TABLE */
        table { width: 100%; margin-top: 30px; border-collapse: collapse; background: white; }
        th { background: #34495e; color: white; padding: 12px; text-align: left; font-size: 14px; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; }

        .price-tag { background: #fff3e0; color: #e65100; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9em; margin-right: 5px; }
        .ws-tag { background: #e3f2fd; color: #1565c0; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9em; }
    </style>
</head>
<body>

<div style="background: #2c3e50; padding: 10px 20px; margin-bottom: 20px;">
    <a href="/" style="color: white; text-decoration: none; font-weight: bold;">🏠 Home Dashboard</a>
</div>

<div class="container">
    <h2>📦 Add Stock & Pricing</h2>

    <form th:action="@{/products/save}" th:object="${productForm}" method="post">

        <div class="form-grid">
            <div>
                <label>Product Name</label>
                <input type="text" th:field="*{name}" placeholder="e.g. Urea" required>
            </div>
            <div>
                <label>Category</label>
                <select th:field="*{category}">
                    <option value="Fertilizer">Fertilizer</option>
                    <option value="Pesticide">Pesticide</option>
                    <option value="Seeds">Seeds</option>
                    <option value="Equipment">Equipment</option>
                </select>
            </div>
            <div>
                <label>Base Selling Unit</label>
                <select th:field="*{unitType}">
                    <option value="kg">Kilogram (kg)</option>
                    <option value="L">Liter (L)</option>
                    <option value="g">Gram (g)</option>
                    <option value="ml">Milliliter (ml)</option>
                    <option value="pcs">Piece (pcs)</option>
                </select>
            </div>
        </div>

        <br>

        <div class="calc-box">
            <span class="section-title green-text">📊 Step 1: Stock Quantity</span>
            <div class="form-grid">
                <div>
                    <label>Buying Quantity</label>
                    <input type="number" step="0.5" name="buyingQty" placeholder="e.g. 10 (Sacks/Boxes)" required>
                </div>
                <div>
                    <label>Sub-Packets per Unit</label>
                    <input type="number" step="1" name="subItemsPerUnit" placeholder="e.g. 1 (if loose) or 10" required>
                </div>
                <div>
                    <label>Weight/Size per Item</label>
                    <input type="number" step="0.01" name="baseSize" placeholder="e.g. 50 (if 50kg)" required>
                </div>
            </div>
        </div>

        <div class="price-box">
            <span class="section-title orange-text">💰 Step 2: RETAIL Pricing</span>

            <div class="form-grid">
                <div style="grid-column: span 3;">
                    <label>Total Buying Cost (Total Bill Amount)</label>
                    <input type="number" step="0.01" name="totalCostPrice" placeholder="What you paid for all stock" required>
                </div>
            </div>
            <div style="margin: 15px 0; border-top: 1px dashed #ccc;"></div>
            <div class="form-grid form-row-2">
                <div>
                    <label>Option A: Retail Price (Per Package)</label>
                    <input type="number" step="0.01" name="retailPricePerPackage" placeholder="e.g. 300 (Per Sack)">
                </div>
                <div style="text-align:center; font-weight:bold; color:#777; align-self:center;">OR</div>
                <div>
                    <label>Option B: Retail Price (Per Base Unit)</label>
                    <input type="number" step="0.01" name="retailPricePerUnit" placeholder="e.g. 6 (Per kg)">
                </div>
            </div>
        </div>

        <div class="wholesale-box">
            <span class="section-title blue-text">🏭 Step 3: WHOLESALE Pricing (Optional)</span>
            <div class="form-grid form-row-2">
                <div>
                    <label>Option A: Wholesale (Per Package)</label>
                    <input type="number" step="0.01" name="wholesalePricePerPackage" placeholder="e.g. 250 (Per Sack)">
                </div>
                <div style="text-align:center; font-weight:bold; color:#777; align-self:center;">OR</div>
                <div>
                    <label>Option B: Wholesale (Per Base Unit)</label>
                    <input type="number" step="0.01" name="wholesalePricePerUnit" placeholder="e.g. 5 (Per kg)">
                </div>
            </div>
        </div>

        <div class="form-grid">
            <div><label>Supplier Name</label><input type="text" th:field="*{supplierName}"></div>
            <div><label>Buying Date</label><input type="date" th:field="*{buyingDate}" required></div>
            <div><label>Expiry Date</label><input type="date" th:field="*{expiryDate}"></div>
        </div>

        <button type="submit" class="btn">Save Product</button>
    </form>

    <h3>Current Inventory</h3>
    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Total Stock</th>
            <th>Prices (Per Unit)</th>
            <th>Supplier</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.name}">Name</td>
            <td>
                <span style="font-weight:bold;" th:text="${p.totalStock}">0</span>
                <span th:text="${p.unitType}">kg</span>
            </td>
            <td>
                <div class="price-tag" th:text="'Retail: ₹ ' + ${p.retailPricePerUnit}">R: 0.00</div>
                <div class="ws-tag" th:text="'Wholesale: ₹ ' + ${p.wholesalePricePerUnit}">W: 0.00</div>
            </td>
            <td th:text="${p.supplierName}">-</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sales Return Search</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 20px; display: flex; justify-content: center; align-items: center; height: 80vh; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 400px; border-top: 5px solid #e74c3c; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 5px; font-weight: bold; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<div class="card">
    <h2 style="color: #c0392b;">🔄 Sales Return</h2>
    <p style="color: #777; font-size: 14px;">Enter Bill Number to initiate a return</p>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form action="/returns/find" method="post">
        <input type="number" name="billId" placeholder="Bill No. (e.g. 102)" required>
        <button type="submit">Find Bill</button>
    </form>
    <br>
    <a href="/" style="color: #555; text-decoration: none; font-weight: bold;">← Back to Home</a>
</div>
</body>
</html>

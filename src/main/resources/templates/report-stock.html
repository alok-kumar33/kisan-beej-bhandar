<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Stock Valuation</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }

        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #34495e; color: white; }

        /* NAV TABS */
        .nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { background: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; color: #2c3e50; font-weight: bold; border: 1px solid #ddd; }
        .tab:hover { background: #eee; }
        .active-tab { background: #2c3e50; color: white; border-color: #2c3e50; }
    </style>
</head>
<body>

<div class="container">

    <div style="background: #2c3e50; padding: 10px 20px; margin-bottom: 20px; border-radius: 5px;">
        <a href="/" style="color: white; text-decoration: none; font-weight: bold;">🏠 Home</a>
    </div>

    <div class="nav">
        <a href="/reports" class="tab">📊 Dashboard</a>
        <a href="/reports/daybook" class="tab">📅 Day Book</a>
        <a href="/reports/items" class="tab">📦 Item Sales</a>
        <a href="/reports/stock" class="tab active-tab">🏭 Stock Value</a>
    </div>

    <h2>🏭 Inventory Valuation Report</h2>

    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
        <div class="card" style="flex: 1; border-left: 5px solid #2980b9;">
            <span style="font-size: 13px; color: #777;">Total Investment (Cost Value)</span>
            <span style="display:block; font-size: 24px; font-weight: bold;">₹ <span th:text="${inventoryValue}">0.00</span></span>
        </div>
        <div class="card" style="flex: 1; border-left: 5px solid #27ae60;">
            <span style="font-size: 13px; color: #777;">Expected Revenue (Sales Value)</span>
            <span style="display:block; font-size: 24px; font-weight: bold;">₹ <span th:text="${salesValue}">0.00</span></span>
        </div>
        <div class="card" style="flex: 1; border-left: 5px solid #f39c12;">
            <span style="font-size: 13px; color: #777;">Projected Profit</span>
            <span style="display:block; font-size: 24px; font-weight: bold;">₹ <span th:text="${salesValue.subtract(inventoryValue)}">0.00</span></span>
        </div>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Product</th>
                <th>Stock Qty</th>
                <th>Cost Price</th>
                <th>Total Value (Asset)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products}">
                <td th:text="${p.name}">Urea</td>
                <td><span th:text="${p.totalStock}"></span> <span th:text="${p.unitType}">kg</span></td>
                <td th:text="${p.costPricePerUnit}">500</td>
                <td style="font-weight: bold;">₹ <span th:text="${p.costPricePerUnit.multiply(new java.math.BigDecimal(p.totalStock))}">5000</span></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
